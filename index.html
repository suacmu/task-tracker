<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Task Board</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
input,select,textarea,button{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#header{background:#1e3a5f;color:#fff;padding:0 20px;display:flex;align-items:center;height:50px;flex-shrink:0}
.logo-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f97316,#ef4444);display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:10px}
.logo-text{font-weight:700;font-size:17px;color:#fff}
.hsp{flex:1}
.vbtn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:5px;padding:6px 16px;font-weight:600;cursor:pointer;font-size:12px;margin-left:6px}
.vbtn.active{background:#fff;color:#1e3a5f}
#toolbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-shrink:0}
#toolbar select{border:1px solid #d1d5db;border-radius:6px;padding:5px 10px;font-size:12px;color:#374151;background:#fff;cursor:pointer;outline:none}
.tsp{flex:1}
#btn-add{background:#c55a11;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-weight:700;cursor:pointer;font-size:12px}
#main{flex:1;display:flex;overflow:hidden}
/* Board */
#board{flex:1;display:flex;gap:0;padding:14px 12px;overflow-x:auto;overflow-y:hidden}
.col{flex:1;min-width:220px;max-width:300px;margin:0 5px;background:#f8fafc;border-radius:8px;border:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden;transition:all .2s}
.col.drag-over{background:#eff6ff;border:1px dashed #3b82f6}
.col-hd{padding:10px 12px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.col-ic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.col-nm{font-weight:700;font-size:12px;color:#1e293b}
.col-bd2{margin-left:auto;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}
.col-body{padding:8px;overflow-y:auto;flex:1}
.drop-hint{text-align:center;color:#94a3b8;font-size:11px;border:2px dashed #e2e8f0;border-radius:6px;padding:16px;font-style:italic}
/* Card */
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:grab;border:1px solid #f1f5f9;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12)}
.card.dragging{opacity:.4;transform:rotate(1.5deg)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px}
.ctags{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.tag{border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700}
.cacts{display:flex;gap:3px;margin-left:6px;flex-shrink:0}
.ic-btn{background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px;font-size:13px;color:#94a3b8}
.ic-btn:hover{background:#f1f5f9;color:#374151}
.ctitle{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:6px;line-height:1.4}
.cdesc{font-size:11px;color:#64748b;margin-bottom:6px;line-height:1.4}
.sub-row{display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:11px;color:#374151}
.sub-row.sdone{color:#94a3b8;text-decoration:line-through}
.sub-row input{accent-color:#1e3a5f;width:12px;height:12px;flex-shrink:0;margin-top:1px;cursor:pointer}
.sub-due{font-size:10px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.sub-due.ov{color:#dc2626;font-weight:700}
.sub-more{font-size:10px;color:#94a3b8;padding-left:18px;margin-top:2px}
.cdue{font-size:11px;margin-bottom:7px}
.cdue.ok{color:#64748b}
.cdue.ov{color:#dc2626;font-weight:700}
.cnav{display:flex;gap:5px;flex-wrap:wrap}
.nbtn{border:none;border-radius:5px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer}
.nbtn.fwd{background:#1e3a5f;color:#fff}
.nbtn.bck{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0}
.nbtn.hld{background:#fff;color:#64748b;border:1px solid #e2e8f0}
.nbtn.rsm{background:#6366f1;color:#fff}
/* Sidebar */
#sidebar{width:220px;flex-shrink:0;background:#fff;border-left:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:10px 10px 0}
.sb-title{font-size:12px;font-weight:700;color:#1e3a5f;padding-bottom:5px;border-bottom:2px solid #c55a11;display:inline-block;margin-bottom:8px}
.up-list{padding:0 10px 8px;display:flex;flex-direction:column;gap:4px}
.up-item{display:flex;align-items:center;gap:7px;padding:4px 0}
.up-badge{display:flex;flex-direction:column;align-items:center;background:#fff5f5;border-radius:5px;padding:3px 5px;min-width:34px;flex-shrink:0}
.up-num{font-size:13px;font-weight:800;color:#c55a11;line-height:1}
.up-mon{font-size:8px;font-weight:700;color:#f97316;text-transform:uppercase;line-height:1.3}
.up-info{flex:1;min-width:0}
.up-name{font-size:11px;font-weight:600;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-cat{font-size:9px;padding:1px 5px;border-radius:3px;color:#fff;display:inline-block;margin-top:2px}
.calwrap{flex:1;overflow-y:auto;padding:8px 10px 10px}
.mini-cal{margin-bottom:12px}
.cal-mth{text-align:center;font-weight:700;font-size:10px;color:#1e3a5f;padding:4px 0;background:#f0f6ff;border-radius:4px;margin-bottom:5px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cdn{text-align:center;font-size:8px;font-weight:700;color:#94a3b8;padding-bottom:2px}
.cd{text-align:center;font-size:9px;padding:2px 1px;border-radius:3px;position:relative;line-height:1.4}
.cd.today{background:#1e3a5f;color:#fff;font-weight:700}
.cd.hol{background:#fff1f0;color:#dc2626;font-weight:700}
.cd.sun{color:#dc2626}
.cd.dot::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#c55a11}
.cal-leg{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.cl-i{display:flex;align-items:center;gap:3px;font-size:9px;color:#94a3b8}
.cl-sw{width:9px;height:9px;border-radius:2px;flex-shrink:0}
/* Dashboard */
#dashboard{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:14px;background:#f0f2f5}
.krow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kcard{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.kic{font-size:18px;margin-bottom:6px}
.knum{font-size:26px;font-weight:800;line-height:1}
.klbl{font-size:11px;color:#64748b;margin-top:3px}
.ksub{font-size:10px;margin-top:2px;font-weight:600}
.cmpcard{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.cmphd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cmptitle{font-size:13px;font-weight:700;color:#1e293b}
.cmppct{font-size:18px;font-weight:800;color:#1e3a5f}
.cmpbg{height:10px;background:#f1f5f9;border-radius:6px;overflow:hidden;margin-bottom:10px}
.cmpfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#1e3a5f,#3b82f6);transition:width .5s}
.pritags{display:flex;gap:8px;flex-wrap:wrap}
.ptag{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600}
.chrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chbox{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.chtitle{font-size:12px;font-weight:700;color:#1e293b;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #c55a11}
.ch-wrap{position:relative;height:200px;width:100%}
.catbox{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.cattitle{font-size:12px;font-weight:700;color:#1e293b;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #c55a11}
.catr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.catrl{display:flex;align-items:center;gap:7px;width:85px;flex-shrink:0}
.catdot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.catrn{font-size:11px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbg{flex:1;height:6px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.catfill{height:100%;border-radius:4px;transition:width .4s}
.catstat{font-size:10px;color:#64748b;white-space:nowrap;width:130px;text-align:right;flex-shrink:0}
/* Modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000}
#ov.open{display:flex}
#modal{background:#fff;border-radius:10px;width:500px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.mhd{background:#1e3a5f;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
.mhdtitle{color:#fff;font-weight:700;font-size:13px}
.mclose{background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;line-height:1}
.mclose:hover{color:#fff}
.mbd{padding:20px}
.fl{font-size:10px;font-weight:700;color:#6b7280;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:13px;color:#1e293b;background:#fff;outline:none}
.fi:focus{border-color:#1e3a5f}
textarea.fi{resize:vertical;min-height:60px}
.fg{margin-bottom:12px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sadd{display:flex;gap:6px;margin-bottom:8px}
.sadd .fi{flex:1}
.sadd input[type=date]{width:120px;border:1px solid #d1d5db;border-radius:6px;padding:8px;font-size:12px;color:#374151;background:#fff;outline:none}
.sabtn{background:#1e3a5f;color:#fff;border:none;border-radius:6px;padding:0 12px;cursor:pointer;font-size:18px;height:38px;flex-shrink:0}
.sit{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.sit-txt{flex:1;font-size:12px;color:#374151}
.sit-txt.dn{color:#94a3b8;text-decoration:line-through}
.sit-due{font-size:10px;color:#94a3b8}
.sit-due.ov{color:#dc2626}
.sdinp{font-size:11px;border:1px solid #e5e7eb;border-radius:4px;padding:3px 6px;color:#64748b;background:#fafafa;width:105px}
.sdel{background:none;border:none;cursor:pointer;color:#ef4444;font-size:19px;line-height:1}
.mfooter{display:flex;gap:10px;margin-top:4px}
.bsave{flex:1;background:#1e3a5f;color:#fff;border:none;border-radius:7px;padding:11px;font-weight:700;cursor:pointer;font-size:13px}
.bcancel{flex:1;background:#f9fafb;color:#374151;border:1px solid #e5e7eb;border-radius:7px;padding:11px;font-weight:600;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo-icon">📋</div>
    <span class="logo-text">Task Board</span>
    <div class="hsp"></div>
    <button class="vbtn active" id="vb-board" onclick="setView('board')">📋 Board</button>
    <button class="vbtn" id="vb-dash" onclick="setView('dashboard')">📊 Dashboard</button>
  </div>
  <div id="toolbar">
    <select id="f-cat" onchange="renderBoard()">
      <option value="All">All Categories</option>
      <option>EdPEx</option><option>VOC</option><option>Manpower</option>
      <option>FTES</option><option>Admin</option><option>IDP</option><option>OTH</option>
    </select>
    <select id="f-pri" onchange="renderBoard()">
      <option value="All">All Priorities</option>
      <option>Low</option><option>Medium</option><option>High</option><option>Very High</option>
    </select>
    <div class="tsp"></div>
    <button id="btn-add" onclick="openModal()">+ Add Task</button>
  </div>
  <div id="main">
    <div id="board"></div>
    <div id="sidebar">
      <div class="sb-top"><div class="sb-title">Upcoming</div></div>
      <div class="up-list" id="up-list"></div>
      <div class="calwrap" id="calwrap"></div>
    </div>
    <div id="dashboard"></div>
  </div>
</div>

<div id="ov">
  <div id="modal">
    <div class="mhd">
      <span class="mhdtitle" id="mtitle">New Task</span>
      <button class="mclose" onclick="closeModal()">×</button>
    </div>
    <div class="mbd">
      <div class="fg"><label class="fl">Title *</label><input class="fi" id="fi-t" placeholder="Task title..."/></div>
      <div class="fg"><label class="fl">Description</label><textarea class="fi" id="fi-d" placeholder="Optional..."></textarea></div>
      <div class="twocol">
        <div><label class="fl">Status</label><select class="fi" id="fi-s"><option>To Do</option><option>In Progress</option><option>Done</option><option>Hold</option></select></div>
        <div><label class="fl">Priority</label><select class="fi" id="fi-p"><option>Low</option><option selected>Medium</option><option>High</option><option>Very High</option></select></div>
        <div><label class="fl">Category</label><select class="fi" id="fi-c"><option>EdPEx</option><option>VOC</option><option>Manpower</option><option>FTES</option><option>Admin</option><option>IDP</option><option>OTH</option></select></div>
        <div><label class="fl">Due Date</label><input type="date" class="fi" id="fi-due"/></div>
      </div>
      <div class="fg">
        <label class="fl">Subtasks</label>
        <div class="sadd">
          <input class="fi" id="fi-st" placeholder="Add subtask..." onkeydown="if(event.key==='Enter')addSub()"/>
          <input type="date" id="fi-sd"/>
          <button class="sabtn" onclick="addSub()">+</button>
        </div>
        <div id="slist"></div>
      </div>
      <div class="mfooter">
        <button class="bsave" id="bsave" onclick="saveTask()">Create Task</button>
        <button class="bcancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
const STATUSES  = ["To Do","In Progress","Done","Hold"];
const MAIN_FLOW = ["To Do","In Progress","Done"];
const PRIORITIES= ["Low","Medium","High","Very High"];
const CATEGORIES= ["EdPEx","VOC","Manpower","FTES","Admin","IDP","OTH"];
const CC = {"To Do":"#6366f1","In Progress":"#f97316","Done":"#22c55e","Hold":"#94a3b8"};
const CB = {"To Do":"#eef2ff","In Progress":"#fff7ed","Done":"#f0fdf4","Hold":"#f8fafc"};
const CI = {"To Do":"📝","In Progress":"⚡","Done":"✅","Hold":"⏸️"};
const PC = {Low:"#22c55e",Medium:"#3b82f6",High:"#f97316","Very High":"#ef4444"};
const PB = {Low:"#f0fdf4",Medium:"#eff6ff",High:"#fff7ed","Very High":"#fef2f2"};
const GC = {EdPEx:"#1d4ed8",VOC:"#c55a11",Manpower:"#475569",FTES:"#0f766e",Admin:"#334155",IDP:"#7c3aed",OTH:"#64748b"};
const MN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DN = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const HOL={"2026-01-01":"New Year","2026-02-21":"Makha Bucha","2026-04-06":"Chakri Day","2026-04-13":"Songkran","2026-04-14":"Songkran","2026-04-15":"Songkran","2026-05-01":"Labour Day","2026-05-04":"Coronation","2026-05-11":"Visakha Bucha","2026-06-03":"Queen Suthida Bday","2026-07-07":"Asanha Bucha","2026-07-08":"Buddhist Lent","2026-07-28":"King Birthday","2026-08-12":"Queen Mother Bday","2026-10-13":"King Bhumibol Memorial","2026-10-23":"Chulalongkorn Day","2026-12-05":"King Bhumibol Bday","2026-12-10":"Constitution Day","2026-12-31":"New Year Eve"};

let tasks=[], editId=null, dragId=null, curView="board", tmpSubs=[];
let chSt=null, chPr=null;

function load(){try{const s=localStorage.getItem("ktasks");if(s)tasks=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem("ktasks",JSON.stringify(tasks));}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML;};
const fmt=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};
const isOv=d=>d&&new Date(d)<new Date(new Date().toDateString());
const toKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const fi=MAIN_FLOW.indexOf.bind(MAIN_FLOW);

function setView(v){
  curView=v;
  document.getElementById("vb-board").className="vbtn"+(v==="board"?" active":"");
  document.getElementById("vb-dash").className="vbtn"+(v==="dashboard"?" active":"");
  document.getElementById("board").style.display=v==="board"?"flex":"none";
  document.getElementById("sidebar").style.display=v==="board"?"flex":"none";
  document.getElementById("toolbar").style.display=v==="board"?"flex":"none";
  const dash=document.getElementById("dashboard");
  dash.style.display=v==="dashboard"?"flex":"none";
  if(v==="board"){renderBoard();}
  else{dash.style.flexDirection="column"; renderDash();}
}

function filtered(){
  const p=document.getElementById("f-pri").value,c=document.getElementById("f-cat").value;
  return tasks.filter(t=>(p==="All"||t.priority===p)&&(c==="All"||t.category===c));
}

function renderBoard(){
  const ft=filtered();
  const board=document.getElementById("board");
  board.innerHTML="";
  STATUSES.forEach(st=>{
    const ct=ft.filter(t=>t.status===st);
    const col=document.createElement("div");
    col.className="col";
    col.innerHTML=`<div class="col-hd" style="border-bottom:2px solid ${CC[st]}">
      <div class="col-ic" style="background:${CB[st]}">${CI[st]}</div>
      <span class="col-nm">${st}</span>
      <span class="col-bd2" style="background:${CC[st]}">${ct.length}</span>
    </div>
    <div class="col-body" id="cb-${st.replace(/\s/g,"-")}"></div>`;
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag-over");});
    col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
    col.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("drag-over");
      if(dragId){const t=tasks.find(x=>x.id===dragId);if(t){t.status=st;save();renderBoard();renderSidebar();}}
    });
    board.appendChild(col);
    const body=document.getElementById("cb-"+st.replace(/\s/g,"-"));
    if(ct.length===0)body.innerHTML='<div class="drop-hint">Drop here</div>';
    else ct.forEach(t=>body.appendChild(makeCard(t)));
  });
  renderSidebar();
}

function makeCard(t){
  const idx=fi(t.status), canF=idx>=0&&idx<MAIN_FLOW.length-1, canB=idx>0;
  const subs=t.subtasks.slice(0,3), more=t.subtasks.length-3;
  const over=isOv(t.dueDate)&&t.status!=="Done";
  const d=document.createElement("div");
  d.className="card"; d.draggable=true;
  d.innerHTML=`
    <div class="ctop">
      <div class="ctags">
        <span class="tag" style="background:${GC[t.category]};color:#fff">${t.category}</span>
        <span class="tag" style="background:${PB[t.priority]};color:${PC[t.priority]}">${t.priority}</span>
      </div>
      <div class="cacts">
        <button class="ic-btn" onclick="openModal('${t.id}')">✏️</button>
        <button class="ic-btn" onclick="delTask('${t.id}')">🗑️</button>
      </div>
    </div>
    <div class="ctitle">${esc(t.title)}</div>
    ${t.description?`<div class="cdesc">${esc(t.description)}</div>`:''}
    ${subs.length?`<div style="margin-bottom:6px">${subs.map((s,i)=>`
      <div class="sub-row ${s.done?'sdone':''}">
        <input type="checkbox" ${s.done?"checked":""} onchange="toggleSub('${t.id}',${t.subtasks.indexOf(s)})"/>
        <span>${esc(s.text)}</span>
        ${s.dueDate?`<span class="sub-due ${isOv(s.dueDate)&&!s.done?'ov':''}">⚠️ ${fmt(s.dueDate)}</span>`:''}
      </div>`).join('')}
    ${more>0?`<div class="sub-more">+${more} more</div>`:''}</div>`:''}
    ${t.dueDate?`<div class="cdue ${over?'ov':'ok'}">📅 ${fmt(t.dueDate)}${over?' ⚠️ Overdue':''}</div>`:''}
    <div class="cnav">
      ${canB?`<button class="nbtn bck" onclick="moveTo('${t.id}','${MAIN_FLOW[idx-1]}')">← Back</button>`:''}
      ${canF?`<button class="nbtn fwd" onclick="moveTo('${t.id}','${MAIN_FLOW[idx+1]}')">Forward →</button>`:''}
      ${t.status!=="Hold"?`<button class="nbtn hld" onclick="moveTo('${t.id}','Hold')">⏸ Hold</button>`:''}
      ${t.status==="Hold"?`<button class="nbtn rsm" onclick="moveTo('${t.id}','To Do')">↩ Resume</button>`:''}
    </div>`;
  d.addEventListener("dragstart",()=>{dragId=t.id;d.classList.add("dragging");});
  d.addEventListener("dragend",()=>{dragId=null;d.classList.remove("dragging");});
  return d;
}

function moveTo(id,st){const t=tasks.find(x=>x.id===id);if(t){t.status=st;save();renderBoard();}}
function delTask(id){if(confirm("Delete this task?")){tasks=tasks.filter(t=>t.id!==id);save();renderBoard();}}
function toggleSub(tid,si){const t=tasks.find(x=>x.id===tid);if(t&&t.subtasks[si]){t.subtasks[si].done=!t.subtasks[si].done;save();renderBoard();}}

function renderSidebar(){
  const up=tasks.filter(t=>t.dueDate&&t.status!=="Done").sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);
  document.getElementById("up-list").innerHTML=up.length===0
    ?'<div style="font-size:11px;color:#94a3b8;padding:4px 10px 8px">No upcoming tasks</div>'
    :up.map(t=>{const[y,m,day]=t.dueDate.split("-");return`
      <div class="up-item">
        <div class="up-badge"><span class="up-num">${day}</span><span class="up-mon">${MS[parseInt(m)-1]}</span></div>
        <div class="up-info">
          <div class="up-name">${esc(t.title)}</div>
          <span class="up-cat" style="background:${GC[t.category]}">${t.category}</span>
        </div>
      </div>`;}).join("");
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  document.getElementById("calwrap").innerHTML=
    mkCal(y,m)+mkCal(m===11?y+1:y,m===11?0:m+1)+
    `<div class="cal-leg">
      <div class="cl-i"><div class="cl-sw" style="background:#1e3a5f"></div>Today</div>
      <div class="cl-i"><div class="cl-sw" style="background:#fff1f0;border:1px solid #fca5a5"></div>Holiday</div>
      <div class="cl-i"><div class="cl-sw" style="background:#c55a11;border-radius:50%"></div>Tasks</div>
    </div>`;
}

function mkCal(y,m){
  const now=new Date(),fd=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h=`<div class="mini-cal"><div class="cal-mth">${MN[m]} ${y}</div><div class="cal-g">`;
  DN.forEach(d=>h+=`<div class="cdn">${d}</div>`);
  for(let i=0;i<fd;i++)h+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const k=toKey(y,m,d);
    const isT=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d;
    const isH=!!HOL[k], isSu=(fd+d-1)%7===0;
    const hasDot=tasks.some(t=>t.dueDate===k&&t.status!=="Done");
    let cls="cd"+(isT?" today":isH?" hol":isSu?" sun":"")+(hasDot?" dot":"");
    h+=`<div class="${cls}" title="${isH?HOL[k]:''}">${d}</div>`;
  }
  return h+`</div></div>`;
}

function renderDash(){
  const total=tasks.length,done=tasks.filter(t=>t.status==="Done").length;
  const inp=tasks.filter(t=>t.status==="In Progress").length;
  const ov=tasks.filter(t=>isOv(t.dueDate)&&t.status!=="Done").length;
  const hld=tasks.filter(t=>t.status==="Hold").length;
  const pct=total>0?Math.round((done/total)*100):0;
  const pvh=tasks.filter(t=>t.priority==="Very High"&&t.status!=="Done").length;
  const ph=tasks.filter(t=>t.priority==="High"&&t.status!=="Done").length;
  const catD=CATEGORIES.map(c=>({n:c,tot:tasks.filter(t=>t.category===c).length,dn:tasks.filter(t=>t.category===c&&t.status==="Done").length})).filter(d=>d.tot>0);

  document.getElementById("dashboard").innerHTML=`
    <div class="krow">
      ${[["📋","Total Tasks",total,"#1e3a5f","","#eff6ff"],["✅","Completed",done,"#22c55e",pct+"% rate","#f0fdf4"],["⚡","In Progress",inp,"#f97316","","#fff7ed"],["⚠️","Overdue",ov,"#ef4444","","#fef2f2"],["⏸️","On Hold",hld,"#94a3b8","","#f8fafc"]].map(([ic,lb,vl,cl,sb,bg])=>`
      <div class="kcard" style="border-top:3px solid ${cl};background:${bg}">
        <div class="kic">${ic}</div><div class="knum" style="color:${cl}">${vl}</div>
        <div class="klbl">${lb}</div>${sb?`<div class="ksub" style="color:${cl}">${sb}</div>`:''}
      </div>`).join("")}
    </div>
    <div class="cmpcard">
      <div class="cmphd"><span class="cmptitle">Overall Completion</span><span class="cmppct">${pct}%</span></div>
      <div class="cmpbg"><div class="cmpfill" style="width:${pct}%"></div></div>
      <div class="pritags">
        ${pvh>0?`<span class="ptag" style="background:#fef2f2;color:#ef4444">🔴 ${pvh} Very High priority pending</span>`:''}
        ${ph>0?`<span class="ptag" style="background:#fff7ed;color:#f97316">🟠 ${ph} High priority pending</span>`:''}
        ${pvh===0&&ph===0?`<span class="ptag" style="background:#f0fdf4;color:#22c55e">✅ No high-priority tasks pending</span>`:''}
      </div>
    </div>
    <div class="chrow">
      <div class="chbox"><div class="chtitle">Tasks by Status</div><div class="ch-wrap"><canvas id="cst"></canvas></div></div>
      <div class="chbox"><div class="chtitle">Tasks by Priority</div><div class="ch-wrap"><canvas id="cpr"></canvas></div></div>
    </div>
    <div class="catbox"><div class="cattitle">Tasks by Category</div>
      ${catD.length===0?'<div style="font-size:12px;color:#94a3b8;text-align:center;padding:20px">No tasks yet</div>'
        :catD.map(c=>{const p=c.tot>0?Math.round((c.dn/c.tot)*100):0;return`
        <div class="catr">
          <div class="catrl"><div class="catdot" style="background:${GC[c.n]}"></div><span class="catrn">${c.n}</span></div>
          <div class="catbg"><div class="catfill" style="width:${p}%;background:${GC[c.n]}"></div></div>
          <div class="catstat">${c.tot} tasks · ${c.dn} done · ${p}%</div>
        </div>`;}).join("")}
    </div>`;

  // Destroy old charts
  if(chSt){chSt.destroy();chSt=null;}
  if(chPr){chPr.destroy();chPr=null;}

  // Build chart data
  const stD=STATUSES.map(s=>({l:s,v:tasks.filter(t=>t.status===s).length,c:CC[s]}));
  const prD=PRIORITIES.map(p=>({l:p,v:tasks.filter(t=>t.priority===p).length,c:PC[p]}));

  // Use requestAnimationFrame to ensure canvas is in DOM
  requestAnimationFrame(()=>{
    const cstEl=document.getElementById("cst");
    const cprEl=document.getElementById("cpr");
    if(!cstEl||!cprEl) return;

    const hasStData=stD.some(d=>d.v>0);
    if(hasStData){
      chSt=new Chart(cstEl,{
        type:"doughnut",
        data:{
          labels:stD.map(d=>d.l),
          datasets:[{data:stD.map(d=>d.v),backgroundColor:stD.map(d=>d.c),borderWidth:2,borderColor:"#fff"}]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:"bottom",labels:{font:{size:10},padding:8,boxWidth:10}}}
        }
      });
    } else {
      const ctx=cstEl.getContext("2d");
      ctx.fillStyle="#f1f5f9"; ctx.fillRect(0,0,cstEl.width,cstEl.height);
      ctx.fillStyle="#94a3b8"; ctx.font="12px Segoe UI"; ctx.textAlign="center";
      ctx.fillText("No tasks yet",cstEl.width/2,cstEl.height/2);
    }

    const hasPrData=prD.some(d=>d.v>0);
    if(hasPrData){
      const maxVal=Math.max(...prD.map(d=>d.v));
      chPr=new Chart(cprEl,{
        type:"bar",
        data:{
          labels:prD.map(d=>d.l),
          datasets:[{data:prD.map(d=>d.v),backgroundColor:prD.map(d=>d.c),borderRadius:5,borderSkipped:false}]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{
            y:{beginAtZero:true, max:Math.max(maxVal+1,4), ticks:{stepSize:1,font:{size:10}}, grid:{color:"#f1f5f9"}},
            x:{ticks:{font:{size:10}}, grid:{display:false}}
          }
        }
      });
    }
  });
}

/* ── Modal ── */
function openModal(id){
  editId=id||null;
  const t=id?tasks.find(x=>x.id===id):null;
  tmpSubs=t?t.subtasks.map(s=>({...s})):[];
  document.getElementById("mtitle").textContent=t?"✏️ Edit Task":"➕ New Task";
  document.getElementById("bsave").textContent=t?"Save Changes":"Create Task";
  document.getElementById("fi-t").value=t?t.title:"";
  document.getElementById("fi-d").value=t?t.description:"";
  document.getElementById("fi-s").value=t?t.status:"To Do";
  document.getElementById("fi-p").value=t?t.priority:"Medium";
  document.getElementById("fi-c").value=t?t.category:"EdPEx";
  document.getElementById("fi-due").value=t?t.dueDate:"";
  document.getElementById("fi-st").value="";
  document.getElementById("fi-sd").value="";
  renderSList();
  document.getElementById("ov").classList.add("open");
  setTimeout(()=>document.getElementById("fi-t").focus(),50);
}
function closeModal(){document.getElementById("ov").classList.remove("open");}
function addSub(){
  const txt=document.getElementById("fi-st").value.trim();
  if(!txt)return;
  tmpSubs.push({text:txt,done:false,dueDate:document.getElementById("fi-sd").value});
  document.getElementById("fi-st").value="";
  document.getElementById("fi-sd").value="";
  renderSList();
}
function renderSList(){
  document.getElementById("slist").innerHTML=tmpSubs.map((s,i)=>`
    <div class="sit">
      <input type="checkbox" ${s.done?"checked":""} onchange="tgS(${i})" style="accent-color:#1e3a5f;width:13px;height:13px"/>
      <div style="flex:1">
        <div class="sit-txt ${s.done?'dn':''}">${esc(s.text)}</div>
        ${s.dueDate?`<div class="sit-due ${isOv(s.dueDate)?'ov':''}">📅 ${fmt(s.dueDate)}</div>`:''}
      </div>
      <input type="date" class="sdinp" value="${s.dueDate||''}" onchange="upSD(${i},this.value)"/>
      <button class="sdel" onclick="delS(${i})">×</button>
    </div>`).join("");
}
function tgS(i){tmpSubs[i].done=!tmpSubs[i].done;renderSList();}
function upSD(i,v){tmpSubs[i].dueDate=v;renderSList();}
function delS(i){tmpSubs.splice(i,1);renderSList();}
function saveTask(){
  const title=document.getElementById("fi-t").value.trim();
  if(!title){document.getElementById("fi-t").focus();return;}
  const t={id:editId||uid(),title,description:document.getElementById("fi-d").value,
    status:document.getElementById("fi-s").value,priority:document.getElementById("fi-p").value,
    category:document.getElementById("fi-c").value,dueDate:document.getElementById("fi-due").value,
    subtasks:[...tmpSubs]};
  if(editId)tasks=tasks.map(x=>x.id===editId?t:x); else tasks.push(t);
  save();closeModal();
  if(curView==="board")renderBoard(); else renderDash();
}

document.getElementById("ov").addEventListener("click",function(e){if(e.target===this)closeModal();});

load();
setView("board");
</script>
