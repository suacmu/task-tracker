<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Task Board</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
input,select,textarea,button{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Header ── */
#header{background:#1e3a5f;color:#fff;padding:0 20px;display:flex;align-items:center;height:50px;flex-shrink:0}
.header-logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f97316,#ef4444);display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{font-weight:700;font-size:17px;color:#fff}
.header-spacer{flex:1}
.view-btn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:5px;padding:6px 16px;font-weight:600;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;margin-left:6px}
.view-btn.active{background:#fff;color:#1e3a5f}

/* ── Toolbar ── */
#toolbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-shrink:0}
#toolbar select{border:1px solid #d1d5db;border-radius:6px;padding:5px 10px;font-size:12px;color:#374151;background:#fff;cursor:pointer;outline:none}
#toolbar select:focus{border-color:#1e3a5f}
.toolbar-spacer{flex:1}
#btn-add{background:#c55a11;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-weight:700;cursor:pointer;font-size:12px}

/* ── Main ── */
#main{flex:1;display:flex;overflow:hidden}

/* ── Board columns ── */
#board{flex:1;display:flex;gap:0;padding:14px 12px;overflow-x:auto;overflow-y:hidden}
.col{flex:1;min-width:220px;max-width:300px;margin:0 5px;background:#f8fafc;border-radius:8px;border:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s,background .2s}
.col.drag-over{background:#eff6ff;border-color:#3b82f6;border-style:dashed}
.col-header{padding:10px 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent;flex-shrink:0}
.col-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.col-name{font-weight:700;font-size:12px;color:#1e293b}
.col-badge{margin-left:auto;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}
.col-body{padding:8px;overflow-y:auto;flex:1}
.drop-hint{text-align:center;color:#94a3b8;font-size:11px;border:2px dashed #e2e8f0;border-radius:6px;padding:16px;margin:4px 0;font-style:italic}

/* ── Card ── */
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:grab;border:1px solid #f1f5f9;transition:box-shadow .2s}
.card:hover{box-shadow:0 3px 8px rgba(0,0,0,.12)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45;transform:rotate(1deg)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.tag{border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700}
.card-actions-top{display:flex;gap:4px;flex-shrink:0;margin-left:6px}
.btn-icon{background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px;font-size:13px;color:#94a3b8;line-height:1}
.btn-icon:hover{background:#f1f5f9;color:#374151}
.card-title{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:6px;line-height:1.4}
.card-subtasks{margin-bottom:6px}
.subtask-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;color:#374151}
.subtask-row.done-sub{color:#94a3b8;text-decoration:line-through}
.subtask-row input[type=checkbox]{accent-color:#1e3a5f;width:12px;height:12px;flex-shrink:0;cursor:pointer}
.subtask-row .sub-due{font-size:10px;margin-left:auto;flex-shrink:0}
.subtask-row .sub-due.overdue{color:#dc2626;font-weight:700}
.subtask-more{font-size:10px;color:#94a3b8;margin-top:2px;padding-left:18px}
.card-due{font-size:11px;margin-bottom:7px;display:flex;align-items:center;gap:4px}
.card-due.ok{color:#64748b}
.card-due.overdue{color:#dc2626;font-weight:700}
.card-nav{display:flex;gap:5px;flex-wrap:wrap}
.btn-nav{border:none;border-radius:5px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:3px}
.btn-forward{background:#1e3a5f;color:#fff}
.btn-back{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0}
.btn-hold{background:#fff;color:#64748b;border:1px solid #e2e8f0}
.btn-hold:hover{background:#fff7ed;color:#f97316;border-color:#fed7aa}

/* ── Sidebar ── */
#sidebar{width:220px;flex-shrink:0;background:#fff;border-left:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.sidebar-section{padding:10px 10px 0}
.sidebar-title{font-size:12px;font-weight:700;color:#1e3a5f;margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid #c55a11;display:inline-block}
.upcoming-list{padding:0 10px 8px;display:flex;flex-direction:column;gap:4px}
.upcoming-item{display:flex;align-items:center;gap:7px;padding:4px 0}
.upcoming-date-badge{display:flex;flex-direction:column;align-items:center;background:#fff5f5;border-radius:5px;padding:3px 6px;min-width:34px;flex-shrink:0}
.upcoming-date-num{font-size:13px;font-weight:800;color:#c55a11;line-height:1}
.upcoming-date-month{font-size:8px;font-weight:700;color:#f97316;text-transform:uppercase;line-height:1.2}
.upcoming-info{flex:1;min-width:0}
.upcoming-task-name{font-size:11px;font-weight:600;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upcoming-task-cat{font-size:9px;padding:1px 5px;border-radius:3px;color:#fff;display:inline-block;margin-top:1px}
.upcoming-dot{width:6px;height:6px;border-radius:50%;background:#c55a11;flex-shrink:0;margin-left:2px}
.cal-wrapper{flex:1;overflow-y:auto;padding:8px 10px 10px}
.mini-cal{margin-bottom:12px}
.cal-month-title{text-align:center;font-weight:700;font-size:10px;color:#1e3a5f;padding:4px 0;background:#f0f6ff;border-radius:4px;margin-bottom:5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dn{text-align:center;font-size:8px;font-weight:700;color:#94a3b8;padding-bottom:2px}
.cal-d{text-align:center;font-size:9px;padding:2px 1px;border-radius:3px;position:relative;line-height:1.4}
.cal-d.today{background:#1e3a5f;color:#fff;font-weight:700}
.cal-d.holiday{background:#fff1f0;color:#dc2626;font-weight:700}
.cal-d.sun{color:#dc2626}
.cal-d.has-dot::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#c55a11;display:block}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cl-item{display:flex;align-items:center;gap:3px;font-size:8.5px;color:#94a3b8}
.cl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── Dashboard ── */
#dashboard{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:14px;background:#f0f2f5}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi-card{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.kpi-icon{font-size:18px;margin-bottom:6px}
.kpi-num{font-size:26px;font-weight:800;line-height:1}
.kpi-label{font-size:11px;color:#64748b;margin-top:3px}
.kpi-sub{font-size:10px;margin-top:2px;font-weight:600}
.completion-card{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.completion-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.completion-title{font-size:13px;font-weight:700;color:#1e293b}
.completion-pct{font-size:18px;font-weight:800;color:#1e3a5f}
.completion-bar-bg{height:10px;background:#f1f5f9;border-radius:6px;overflow:hidden;margin-bottom:10px}
.completion-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#1e3a5f,#3b82f6);transition:width .5s}
.priority-tags{display:flex;gap:8px;flex-wrap:wrap}
.pri-tag{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600;display:flex;align-items:center;gap:3px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-card{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.chart-card-title{font-size:12px;font-weight:700;color:#1e293b;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #c55a11}
.cat-card{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb}
.cat-card-title{font-size:12px;font-weight:700;color:#1e293b;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #c55a11}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-row-left{display:flex;align-items:center;gap:8px;width:90px;flex-shrink:0}
.cat-color-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.cat-row-name{font-size:11px;font-weight:700;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row-bar-wrap{flex:1;height:6px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.cat-row-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.cat-row-stat{font-size:10px;color:#64748b;white-space:nowrap;width:120px;text-align:right;flex-shrink:0}

/* ── Modal ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000}
#modal-overlay.open{display:flex}
#modal{background:#fff;border-radius:10px;width:500px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-hd{background:#1e3a5f;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
.modal-hd-title{color:#fff;font-weight:700;font-size:13px}
.modal-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
.modal-bd{padding:20px}
.f-label{font-size:10px;font-weight:700;color:#6b7280;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.f-inp{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:13px;color:#1e293b;background:#fff;outline:none;transition:border-color .2s}
.f-inp:focus{border-color:#1e3a5f}
textarea.f-inp{resize:vertical;min-height:60px}
.f-row{margin-bottom:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sub-add{display:flex;gap:6px;margin-bottom:8px}
.sub-add .f-inp{flex:1}
.sub-add input[type=date]{width:120px;border:1px solid #d1d5db;border-radius:6px;padding:8px 8px;font-size:12px;color:#374151;background:#fff;outline:none}
.btn-add-sub{background:#1e3a5f;color:#fff;border:none;border-radius:6px;padding:0 12px;cursor:pointer;font-size:18px;height:38px;flex-shrink:0}
.sub-item{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.sub-item-text{flex:1;font-size:12px;color:#374151}
.sub-item-text.done{color:#94a3b8;text-decoration:line-through}
.sub-item-due-sm{font-size:10px;color:#94a3b8}
.sub-item-due-sm.ov{color:#dc2626}
.sub-date-inp{font-size:11px;border:1px solid #e5e7eb;border-radius:4px;padding:3px 6px;color:#64748b;background:#fafafa;width:105px}
.btn-del-sub{background:none;border:none;cursor:pointer;color:#ef4444;font-size:19px;line-height:1;padding:0 2px}
.modal-footer{display:flex;gap:10px;margin-top:4px}
.btn-save{flex:1;background:#1e3a5f;color:#fff;border:none;border-radius:7px;padding:11px;font-weight:700;cursor:pointer;font-size:13px}
.btn-save:hover{background:#1e4d7b}
.btn-cancel{flex:1;background:#f9fafb;color:#374151;border:1px solid #e5e7eb;border-radius:7px;padding:11px;font-weight:600;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <div class="header-logo">
      <div class="logo-icon">📋</div>
      <span class="logo-text">Task Board</span>
    </div>
    <div class="header-spacer"></div>
    <button class="view-btn active" id="vbtn-board" onclick="setView('board')">📋 Board</button>
    <button class="view-btn" id="vbtn-dash" onclick="setView('dashboard')">📊 Dashboard</button>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <select id="f-cat" onchange="render()">
      <option value="All">All Categories</option>
      <option>EdPEx</option><option>VOC</option><option>Manpower</option>
      <option>FTES</option><option>Admin</option><option>IDP</option><option>OTH</option>
    </select>
    <select id="f-pri" onchange="render()">
      <option value="All">All Priorities</option>
      <option>Low</option><option>Medium</option><option>High</option><option>Very High</option>
    </select>
    <div class="toolbar-spacer"></div>
    <button id="btn-add" onclick="openModal()">+ Add Task</button>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- Board -->
    <div id="board"></div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Upcoming</div>
      </div>
      <div class="upcoming-list" id="upcoming-list"></div>
      <div class="cal-wrapper" id="cal-wrapper"></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-hd">
      <span class="modal-hd-title" id="modal-title">New Task</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-bd">
      <div class="f-row">
        <label class="f-label">Title *</label>
        <input class="f-inp" id="fi-title" placeholder="Task title..."/>
      </div>
      <div class="f-row">
        <label class="f-label">Description</label>
        <textarea class="f-inp" id="fi-desc" placeholder="Optional description..."></textarea>
      </div>
      <div class="two-col">
        <div><label class="f-label">Status</label>
          <select class="f-inp" id="fi-status">
            <option>To Do</option><option>In Progress</option><option>Done</option><option>Hold</option>
          </select></div>
        <div><label class="f-label">Priority</label>
          <select class="f-inp" id="fi-priority">
            <option>Low</option><option selected>Medium</option><option>High</option><option>Very High</option>
          </select></div>
        <div><label class="f-label">Category</label>
          <select class="f-inp" id="fi-category">
            <option>EdPEx</option><option>VOC</option><option>Manpower</option><option>FTES</option>
            <option>Admin</option><option>IDP</option><option>OTH</option>
          </select></div>
        <div><label class="f-label">Due Date</label>
          <input type="date" class="f-inp" id="fi-due"/></div>
      </div>
      <div class="f-row">
        <label class="f-label">Subtasks</label>
        <div class="sub-add">
          <input class="f-inp" id="fi-sub-text" placeholder="Add subtask..." onkeydown="if(event.key==='Enter')addSub()"/>
          <input type="date" id="fi-sub-date"/>
          <button class="btn-add-sub" onclick="addSub()">+</button>
        </div>
        <div id="sub-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-save" id="btn-save" onclick="saveTask()">Create Task</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Constants ── */
const STATUSES   = ["To Do","In Progress","Done","Hold"];
const MAIN_FLOW  = ["To Do","In Progress","Done"];
const PRIORITIES = ["Low","Medium","High","Very High"];
const CATEGORIES = ["EdPEx","VOC","Manpower","FTES","Admin","IDP","OTH"];
const COL_COLOR  = {"To Do":"#6366f1","In Progress":"#f97316","Done":"#22c55e","Hold":"#94a3b8"};
const COL_BG     = {"To Do":"#eef2ff","In Progress":"#fff7ed","Done":"#f0fdf4","Hold":"#f8fafc"};
const COL_ICON   = {"To Do":"📝","In Progress":"⚡","Done":"✅","Hold":"⏸️"};
const P_COLOR    = {Low:"#22c55e",Medium:"#3b82f6",High:"#f97316","Very High":"#ef4444"};
const P_BG       = {Low:"#f0fdf4",Medium:"#eff6ff",High:"#fff7ed","Very High":"#fef2f2"};
const C_COLOR    = {EdPEx:"#1d4ed8",VOC:"#c55a11",Manpower:"#475569",FTES:"#0f766e",Admin:"#334155",IDP:"#7c3aed",OTH:"#64748b"};
const MONTHS     = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SH  = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAYS       = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const TH_HOL = {
  "2026-01-01":"New Year's Day","2026-02-21":"Makha Bucha Day","2026-04-06":"Chakri Day",
  "2026-04-13":"Songkran","2026-04-14":"Songkran","2026-04-15":"Songkran",
  "2026-05-01":"Labour Day","2026-05-04":"Coronation Day","2026-05-11":"Visakha Bucha",
  "2026-06-03":"Queen Suthida Birthday","2026-07-07":"Asanha Bucha","2026-07-08":"Buddhist Lent",
  "2026-07-28":"King Birthday","2026-08-12":"Queen Mother Birthday",
  "2026-10-13":"King Bhumibol Memorial","2026-10-23":"Chulalongkorn Day",
  "2026-12-05":"King Bhumibol Birthday","2026-12-10":"Constitution Day","2026-12-31":"New Year Eve"
};

/* ── State ── */
let tasks = [];
let editId = null;
let dragId = null;
let curView = "board";
let tempSubs = [];
let chartStatus = null, chartPri = null;

/* ── Storage ── */
function load(){ try{ const s=localStorage.getItem("ktasks"); if(s) tasks=JSON.parse(s); }catch(e){} }
function save(){ try{ localStorage.setItem("ktasks",JSON.stringify(tasks)); }catch(e){} }

/* ── Utils ── */
const uid     = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc     = s => { const d=document.createElement("div");d.textContent=s;return d.innerHTML; };
const fmtDate = d => { if(!d)return""; const[y,m,day]=d.split("-"); return `${day}/${m}/${y}`; };
const isOv    = d => d && new Date(d) < new Date(new Date().toDateString());
const toKey   = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const flowIdx = s => MAIN_FLOW.indexOf(s);

/* ── View toggle ── */
function setView(v){
  curView=v;
  ["board","dash"].forEach(x=>{
    document.getElementById("vbtn-"+x).className="view-btn"+(v===(x==="dash"?"dashboard":"board")?" active":"");
  });
  document.getElementById("board").style.display     = v==="board"?"flex":"none";
  document.getElementById("sidebar").style.display   = v==="board"?"flex":"none";
  document.getElementById("toolbar").style.display   = v==="board"?"flex":"none";
  document.getElementById("dashboard").style.display = v==="dashboard"?"flex":"none";
  if(v==="board") renderBoard();
  else renderDash();
}

/* ── Filter ── */
function filtered(){
  const p=document.getElementById("f-pri").value, c=document.getElementById("f-cat").value;
  return tasks.filter(t=>(p==="All"||t.priority===p)&&(c==="All"||t.category===c));
}

/* ── Render ── */
function render(){ if(curView==="board") renderBoard(); else renderDash(); }

/* ── Board ── */
function renderBoard(){
  const ft = filtered();
  const board = document.getElementById("board");
  board.innerHTML="";
  STATUSES.forEach(status=>{
    const colTasks = ft.filter(t=>t.status===status);
    const col=document.createElement("div");
    col.className="col"; col.dataset.status=status;
    col.innerHTML=`
      <div class="col-header" style="border-bottom:2px solid ${COL_COLOR[status]}">
        <div class="col-icon" style="background:${COL_BG[status]}">${COL_ICON[status]}</div>
        <span class="col-name">${status}</span>
        <span class="col-badge" style="background:${COL_COLOR[status]}">${colTasks.length}</span>
      </div>
      <div class="col-body" id="cb-${status.replace(/\s+/g,"-")}"></div>`;
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag-over");});
    col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
    col.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("drag-over");
      if(dragId){const t=tasks.find(x=>x.id===dragId);if(t){t.status=status;save();render();}}
    });
    board.appendChild(col);
    const body=document.getElementById("cb-"+status.replace(/\s+/g,"-"));
    if(colTasks.length===0) body.innerHTML='<div class="drop-hint">Drop here</div>';
    else colTasks.forEach(t=>body.appendChild(makeCard(t)));
  });
  renderSidebar();
}

function makeCard(t){
  const fi = flowIdx(t.status);
  const canFwd = fi>=0 && fi<MAIN_FLOW.length-1;
  const canBck = fi>0;
  const canHold= t.status!=="Hold";
  const showSubs = t.subtasks.slice(0,3);
  const moreCnt  = t.subtasks.length-3;
  const over = isOv(t.dueDate)&&t.status!=="Done";

  const div=document.createElement("div");
  div.className="card"; div.draggable=true;
  div.innerHTML=`
    <div class="card-top">
      <div class="card-tags">
        <span class="tag" style="background:${C_COLOR[t.category]};color:#fff">${t.category}</span>
        <span class="tag" style="background:${P_BG[t.priority]};color:${P_COLOR[t.priority]}">${t.priority}</span>
      </div>
      <div class="card-actions-top">
        <button class="btn-icon" title="Edit" onclick="openModal('${t.id}')">✏️</button>
        <button class="btn-icon" title="Delete" onclick="delTask('${t.id}')">🗑️</button>
      </div>
    </div>
    <div class="card-title">${esc(t.title)}</div>
    ${t.description?`<div style="font-size:11px;color:#64748b;margin-bottom:6px;line-height:1.4">${esc(t.description)}</div>`:''}
    ${showSubs.length>0?`<div class="card-subtasks">${showSubs.map((s,i)=>`
      <div class="subtask-row ${s.done?'done-sub':''}">
        <input type="checkbox" ${s.done?"checked":""} onchange="toggleSubTask('${t.id}',${t.subtasks.indexOf(s)})"/>
        <span>${esc(s.text)}</span>
        ${s.dueDate?`<span class="sub-due ${isOv(s.dueDate)&&!s.done?'overdue':''}">⚠️ ${fmtDate(s.dueDate)}</span>`:''}
      </div>`).join('')}
    ${moreCnt>0?`<div class="subtask-more">+${moreCnt} more subtasks</div>`:''}
    </div>`:''}
    ${t.dueDate?`<div class="card-due ${over?'overdue':'ok'}">📅 ${fmtDate(t.dueDate)}${over?' ⚠️ Overdue':''}</div>`:''}
    <div class="card-nav">
      ${canBck?`<button class="btn-nav btn-back" onclick="moveTo('${t.id}','${MAIN_FLOW[fi-1]}')">← Back</button>`:''}
      ${canFwd?`<button class="btn-nav btn-forward" onclick="moveTo('${t.id}','${MAIN_FLOW[fi+1]}')">Forward →</button>`:''}
      ${canHold?`<button class="btn-nav btn-hold" onclick="moveTo('${t.id}','Hold')">⏸ Hold</button>`:''}
      ${t.status==="Hold"?`<button class="btn-nav btn-forward" onclick="moveTo('${t.id}','To Do')" style="background:#6366f1">↩ Resume</button>`:''}
    </div>`;
  div.addEventListener("dragstart",()=>{dragId=t.id;div.classList.add("dragging");});
  div.addEventListener("dragend",()=>{dragId=null;div.classList.remove("dragging");});
  return div;
}

function moveTo(id,status){ const t=tasks.find(x=>x.id===id);if(t){t.status=status;save();render();} }
function delTask(id){ if(confirm("Delete this task?")){ tasks=tasks.filter(t=>t.id!==id);save();render(); }}
function toggleSubTask(tid,si){
  const t=tasks.find(x=>x.id===tid);
  if(t&&t.subtasks[si]){ t.subtasks[si].done=!t.subtasks[si].done; save(); render(); }
}

/* ── Sidebar ── */
function renderSidebar(){
  // Upcoming
  const upcoming = tasks.filter(t=>t.dueDate&&t.status!=="Done")
    .sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);
  const ul = document.getElementById("upcoming-list");
  ul.innerHTML = upcoming.length===0
    ? '<div style="font-size:11px;color:#94a3b8;padding:4px 0 8px">No upcoming tasks</div>'
    : upcoming.map(t=>{
        const [y,m,d]=t.dueDate.split("-");
        return `<div class="upcoming-item">
          <div class="upcoming-date-badge">
            <span class="upcoming-date-num">${d}</span>
            <span class="upcoming-date-month">${MONTHS_SH[parseInt(m)-1]}</span>
          </div>
          <div class="upcoming-info">
            <div class="upcoming-task-name">${esc(t.title)}</div>
            <span class="upcoming-task-cat" style="background:${C_COLOR[t.category]}">${t.category}</span>
          </div>
          ${isOv(t.dueDate)?'<div class="upcoming-dot"></div>':''}
        </div>`;
      }).join("");

  // Calendars
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const m2=m===11?0:m+1, y2=m===11?y+1:y;
  document.getElementById("cal-wrapper").innerHTML =
    miniCalHTML(y,m)+miniCalHTML(y2,m2)+
    `<div class="cal-legend">
      <div class="cl-item"><div class="cl-dot" style="background:#1e3a5f"></div>Today</div>
      <div class="cl-item"><div class="cl-dot" style="background:#fff1f0;border:1px solid #fca5a5"></div>Holiday</div>
      <div class="cl-item"><div class="cl-dot" style="background:#c55a11;border-radius:50%"></div>Tasks</div>
    </div>`;
}

function miniCalHTML(y,m){
  const today=new Date(), fd=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  let h=`<div class="mini-cal"><div class="cal-month-title">${MONTHS[m]} ${y}</div><div class="cal-grid">`;
  DAYS.forEach(d=>h+=`<div class="cal-dn">${d}</div>`);
  for(let i=0;i<fd;i++) h+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const key=toKey(y,m,d);
    const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const isHol=!!TH_HOL[key];
    const isSun=(fd+d-1)%7===0;
    const hasDot=tasks.some(t=>t.dueDate===key&&t.status!=="Done");
    let cls="cal-d";
    if(isToday) cls+=" today";
    else if(isHol) cls+=" holiday";
    else if(isSun) cls+=" sun";
    if(hasDot) cls+=" has-dot";
    h+=`<div class="${cls}" title="${isHol?TH_HOL[key]:''}">${d}</div>`;
  }
  return h+`</div></div>`;
}

/* ── Dashboard ── */
function renderDash(){
  const total  = tasks.length;
  const done   = tasks.filter(t=>t.status==="Done").length;
  const inprog = tasks.filter(t=>t.status==="In Progress").length;
  const overdue= tasks.filter(t=>isOv(t.dueDate)&&t.status!=="Done").length;
  const hold   = tasks.filter(t=>t.status==="Hold").length;
  const pct    = total>0?Math.round((done/total)*100):0;
  const pendingVH = tasks.filter(t=>t.priority==="Very High"&&t.status!=="Done").length;
  const pendingH  = tasks.filter(t=>t.priority==="High"&&t.status!=="Done").length;
  const catData= CATEGORIES.map(c=>({
    name:c, total:tasks.filter(t=>t.category===c).length,
    done:tasks.filter(t=>t.category===c&&t.status==="Done").length
  })).filter(d=>d.total>0);

  const dash=document.getElementById("dashboard");
  dash.innerHTML=`
    <div class="kpi-row">
      ${[
        ["📋","Total Tasks",total,"#1e3a5f","","#eff6ff"],
        ["✅","Completed",done,"#22c55e",pct+"% rate","#f0fdf4"],
        ["⚡","In Progress",inprog,"#f97316","","#fff7ed"],
        ["⚠️","Overdue",overdue,"#ef4444","","#fef2f2"],
        ["⏸️","On Hold",hold,"#94a3b8","","#f8fafc"]
      ].map(([ic,lb,vl,cl,sub,bg])=>`
        <div class="kpi-card" style="border-top:3px solid ${cl};background:${bg}">
          <div class="kpi-icon">${ic}</div>
          <div class="kpi-num" style="color:${cl}">${vl}</div>
          <div class="kpi-label">${lb}</div>
          ${sub?`<div class="kpi-sub" style="color:${cl}">${sub}</div>`:''}
        </div>`).join("")}
    </div>
    <div class="completion-card">
      <div class="completion-header">
        <span class="completion-title">Overall Completion</span>
        <span class="completion-pct">${pct}%</span>
      </div>
      <div class="completion-bar-bg"><div class="completion-bar-fill" style="width:${pct}%"></div></div>
      <div class="priority-tags">
        ${pendingVH>0?`<span class="pri-tag" style="background:#fef2f2;color:#ef4444">🔴 ${pendingVH} Very High priority pending</span>`:''}
        ${pendingH>0?`<span class="pri-tag" style="background:#fff7ed;color:#f97316">🟠 ${pendingH} High priority pending</span>`:''}
        ${pendingVH===0&&pendingH===0?`<span class="pri-tag" style="background:#f0fdf4;color:#22c55e">✅ No high-priority tasks pending</span>`:''}
      </div>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-card-title">Tasks by Status</div>
        <canvas id="c-status" height="180"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Tasks by Priority</div>
        <canvas id="c-pri" height="180"></canvas>
      </div>
    </div>
    <div class="cat-card">
      <div class="cat-card-title">Tasks by Category</div>
      ${catData.length===0
        ? '<div style="font-size:12px;color:#94a3b8;text-align:center;padding:20px">No tasks yet</div>'
        : catData.map(c=>{
            const p=c.total>0?Math.round((c.done/c.total)*100):0;
            return `<div class="cat-row">
              <div class="cat-row-left">
                <div class="cat-color-dot" style="background:${C_COLOR[c.name]}"></div>
                <span class="cat-row-name">${c.name}</span>
              </div>
              <div class="cat-row-bar-wrap">
                <div class="cat-row-bar-fill" style="width:${p}%;background:${C_COLOR[c.name]}"></div>
              </div>
              <div class="cat-row-stat">${c.total} tasks · ${c.done} done · ${p}%</div>
            </div>`;}).join("")}
    </div>`;

  if(chartStatus){chartStatus.destroy();chartStatus=null;}
  if(chartPri){chartPri.destroy();chartPri=null;}

  const stData=STATUSES.map(s=>({l:s,v:tasks.filter(t=>t.status===s).length,c:{"To Do":"#6366f1","In Progress":"#f97316","Done":"#22c55e","Hold":"#94a3b8"}[s]})).filter(d=>d.v>0);
  const prData=PRIORITIES.map(p=>({l:p,v:tasks.filter(t=>t.priority===p).length,c:P_COLOR[p]})).filter(d=>d.v>0);

  if(stData.length>0){
    chartStatus=new Chart(document.getElementById("c-status"),{
      type:"doughnut",
      data:{labels:stData.map(d=>d.l),datasets:[{data:stData.map(d=>d.v),backgroundColor:stData.map(d=>d.c),borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:10},padding:8,boxWidth:10}}}}
    });
  }
  if(prData.length>0){
    chartPri=new Chart(document.getElementById("c-pri"),{
      type:"bar",
      data:{labels:prData.map(d=>d.l),datasets:[{data:prData.map(d=>d.v),backgroundColor:prData.map(d=>d.c),borderRadius:4,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:10}},grid:{color:"#f1f5f9"}},x:{ticks:{font:{size:10}},grid:{display:false}}}}
    });
  }
}

/* ── Modal ── */
function openModal(id){
  editId=id||null;
  const t=id?tasks.find(x=>x.id===id):null;
  tempSubs=t?t.subtasks.map(s=>({...s})):[];
  document.getElementById("modal-title").textContent = t?"✏️ Edit Task":"➕ New Task";
  document.getElementById("btn-save").textContent    = t?"Save Changes":"Create Task";
  document.getElementById("fi-title").value    = t?t.title:"";
  document.getElementById("fi-desc").value     = t?t.description:"";
  document.getElementById("fi-status").value   = t?t.status:"To Do";
  document.getElementById("fi-priority").value = t?t.priority:"Medium";
  document.getElementById("fi-category").value = t?t.category:"EdPEx";
  document.getElementById("fi-due").value      = t?t.dueDate:"";
  document.getElementById("fi-sub-text").value = "";
  document.getElementById("fi-sub-date").value = "";
  renderSubList();
  document.getElementById("modal-overlay").classList.add("open");
  setTimeout(()=>document.getElementById("fi-title").focus(),50);
}

function closeModal(){ document.getElementById("modal-overlay").classList.remove("open"); }

function addSub(){
  const txt=document.getElementById("fi-sub-text").value.trim();
  if(!txt)return;
  tempSubs.push({text:txt,done:false,dueDate:document.getElementById("fi-sub-date").value});
  document.getElementById("fi-sub-text").value="";
  document.getElementById("fi-sub-date").value="";
  renderSubList();
}

function renderSubList(){
  document.getElementById("sub-list").innerHTML=tempSubs.map((s,i)=>`
    <div class="sub-item">
      <input type="checkbox" ${s.done?"checked":""} onchange="toggleTempSub(${i})" style="accent-color:#1e3a5f;width:13px;height:13px"/>
      <div style="flex:1">
        <div class="sub-item-text ${s.done?'done':''}">${esc(s.text)}</div>
        ${s.dueDate?`<div class="sub-item-due-sm ${isOv(s.dueDate)?'ov':''}">📅 ${fmtDate(s.dueDate)}</div>`:''}
      </div>
      <input type="date" class="sub-date-inp" value="${s.dueDate||''}" onchange="updSubDate(${i},this.value)"/>
      <button class="btn-del-sub" onclick="delSubItem(${i})">×</button>
    </div>`).join("");
}

function toggleTempSub(i){ tempSubs[i].done=!tempSubs[i].done; renderSubList(); }
function updSubDate(i,v){ tempSubs[i].dueDate=v; renderSubList(); }
function delSubItem(i){ tempSubs.splice(i,1); renderSubList(); }

function saveTask(){
  const title=document.getElementById("fi-title").value.trim();
  if(!title){ document.getElementById("fi-title").focus(); return; }
  const t={
    id:editId||uid(), title,
    description:document.getElementById("fi-desc").value,
    status:document.getElementById("fi-status").value,
    priority:document.getElementById("fi-priority").value,
    category:document.getElementById("fi-category").value,
    dueDate:document.getElementById("fi-due").value,
    subtasks:[...tempSubs]
  };
  if(editId) tasks=tasks.map(x=>x.id===editId?t:x);
  else tasks.push(t);
  save(); closeModal(); render();
}

/* ── Close modal on overlay click ── */
document.getElementById("modal-overlay").addEventListener("click",function(e){
  if(e.target===this) closeModal();
});

/* ── Init ── */
load();
setView("board");
</script>
</body>
